version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
  build:
    commands:
      - echo "Build started on $(date)"
      - mvn -B clean package
  post_build:
    commands:
      - cp target/*.jar application.jar
      - echo "Build finished on $(date)"

artifacts:
  files:
    - application.jar
  discard-paths: yes

cache:
  paths:
    - '/root/.m2/**/*'